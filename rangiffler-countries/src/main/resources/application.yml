server:
  port: 8082

spring:
  application:
    name: rangiffler-countries
  grpc:
    server:
      port: 9090
      servlet:
        enabled: false
      security:
        csrf:
          enabled: false
  logging:
    file:
      path: ./logs/rangiffler-countries
    level:
      root: INFO
      org.springframework.web: INFO
      org.springframework.security: INFO
      org.springframework.security.oauth2: INFO
      net.devh.boot.grpc: INFO
      org.springframework.boot.autoconfigure: INFO
  datasource:
    url: 'jdbc:postgresql://127.0.0.1:5432/rangiffler-countries'
    username: postgres
    password: secret
    hikari:
      connection-timeout: 20000
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 10000
      max-lifetime: 1000
      auto-commit: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    locations: classpath:db/migration/rangiffler-countries
    debug: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    generate-ddl: true
    open-in-view: false