server:
  port: 8081

spring:
  application:
    name: rangiffler-userdata
  grpc:
    server:
      port: 9091
      servlet:
        enabled: false
      security:
        csrf:
          enabled: false
      max-inbound-message-size: 10485760
    client:
      channels:
        countries-service:
          address: 127.0.0.1:9090
  kafka:
    bootstrap-servers: 'localhost:9092'
    consumer:
      group-id: 'userdata'
      auto-offset-reset: earliest
  logging:
    file:
      path: ./logs/rangiffler-userdata
    level:
      root: INFO
      org.springframework.web: INFO
      org.springframework.security: INFO
      org.springframework.security.oauth2: INFO
      net.devh.boot.grpc: INFO
      org.springframework.boot.autoconfigure: INFO
  datasource:
    url: 'jdbc:postgresql://127.0.0.1:5432/rangiffler-userdata'
    username: postgres
    password: secret
    hikari:
      connection-timeout: 20000
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 10000
      max-lifetime: 1000
      auto-commit: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    locations: classpath:db/migration/rangiffler-userdata
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    generate-ddl: true
    open-in-view: false